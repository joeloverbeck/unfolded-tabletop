[package]
name = "unfolded-tabletop"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
publish = false

[workspace]
members = [
    "assets",
    "dev-tools",
    "hover",
    "random",
    "record-replacement",
    "seat-client",
]
exclude = ["vendor/wgpu-hal"]

[features]
default = []
render = ["dep:bevy"]
# The agent seat: its protocol reads and writes JSON lines, and its held session
# starts its own session with `setsid` and waits for requests with `poll`.
seat = ["render", "dep:serde", "rustix/process", "rustix/event"]

[dependencies]
# Compatibility re-exports of the Bevy-free packages; see `src/lib.rs`.
unfolded-assets = { path = "assets" }
unfolded-hover = { path = "hover" }
unfolded-random = { path = "random" }
unfolded-record-replacement = { path = "record-replacement" }
unfolded-seat-client = { path = "seat-client" }
rustix = "1"
serde_json = "1"
serde = { version = "1", features = ["derive"], optional = true }
tempfile = "3"
image = { version = "=0.25.10", default-features = false, features = ["png"] }
bevy = { version = "=0.20.0", optional = true, default-features = false, features = ["std", "bevy_asset", "3d_bevy_render", "bevy_picking", "ui_bevy_render"] }

# Exercise the same owned workaround as both consumers when checking this workspace.
# Dependency patches do not propagate; consumers still pin their own root patch.
[patch.crates-io]
wgpu-hal = { path = "vendor/wgpu-hal" }
