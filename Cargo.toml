[package]
name = "unfolded-tabletop"
version = "0.1.0"
edition = "2024"
rust-version = "1.100.0"
license = "MIT"
publish = false

[workspace]
members = [
    "assets",
    "dev-tools",
    "hover",
    "random",
    "record-replacement",
    "seat-client",
    "seat-protocol",
]
exclude = ["vendor/wgpu-hal"]

[features]
default = []
# A capture converts Bevy's picture through `image` before it writes it.
render = ["dep:bevy", "dep:image"]
# The agent seat: its protocol reads and writes JSON lines, and its held session
# makes its private directory, starts its own session with `setsid` and waits for
# requests with `poll`.
# Its wire vocabulary is `unfolded-seat-protocol`, which the held-seat client shares.
seat = [
    "render",
    "dep:serde_json",
    "dep:tempfile",
    "dep:unfolded-seat-protocol",
    "rustix/process",
    "rustix/event",
]

[dependencies]
rustix = { version = "1", optional = true }
serde_json = { version = "1", optional = true }
tempfile = { version = "3", optional = true }
unfolded-seat-protocol = { path = "seat-protocol", optional = true }
image = { version = "=0.25.10", default-features = false, features = ["png"], optional = true }
bevy = { version = "=0.20.0", optional = true, default-features = false, features = ["std", "bevy_asset", "3d_bevy_render", "bevy_picking", "ui_bevy_render", "bevy_ui_widgets", "bevy_winit", "x11"] }

[dev-dependencies]
image = { version = "=0.25.10", default-features = false, features = ["png"] }
serde_json = "1"
tempfile = "3"

# Exercise the same owned workaround as both consumers when checking this workspace.
# Dependency patches do not propagate; consumers still pin their own root patch.
[patch.crates-io]
wgpu-hal = { path = "vendor/wgpu-hal" }

# A game's start of its seat, end to end: the launcher starts this executable again
# as the seat, so it has no test harness, and each game command it runs is a process
# of its own.
[[test]]
name = "seat_start"
harness = false
required-features = ["seat"]
