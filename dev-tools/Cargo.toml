[package]
name = "unfolded-dev-tools"
version = "0.1.0"
edition = "2024"
rust-version = "1.100.0"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
image = { version = "=0.25.10", default-features = false, features = ["png"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"

# The commands run through `run_cli` in dedicated processes; the executable
# dispatches its own child modes, so it supplies its own harness.
[[test]]
name = "cli"
path = "tests/cli/main.rs"
harness = false
