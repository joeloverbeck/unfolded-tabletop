[package]
name = "unfolded-agent-players"
version = "0.1.0"
edition = "2024"
rust-version = "1.100.0"
license = "MIT"
publish = false

[dependencies]
serde_json = "1"
unfolded-seat-client = { path = "../seat-client" }

[dev-dependencies]
tempfile = "3"

# The test executable is also the client program that the stand-in for Codex starts, and
# it waits for that child, so it supplies its own harness.
[[test]]
name = "waking"
harness = false
