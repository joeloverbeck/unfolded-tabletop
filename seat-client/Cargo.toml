[package]
name = "unfolded-seat-client"
version = "0.1.0"
edition = "2024"
rust-version = "1.100.0"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
serde_json = "1"
sha2 = "0.10"
unfolded-seat-protocol = { path = "../seat-protocol" }

[dev-dependencies]
tempfile = "3"

# The test executable is also the stand-in game the recorder starts, and a started
# game prints on standard output, so it supplies its own harness.
[[test]]
name = "held_start"
harness = false
